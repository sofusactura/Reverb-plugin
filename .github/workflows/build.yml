name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
          - name: macOS
            os: macos-latest
            pluginval: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval
          - name: Linux
            os: ubuntu-latest
            pluginval: pluginval_Linux.zip
            pluginval_bin: xvfb-run -a ./pluginval

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Offline DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: HybridGateReverb-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/HybridGateReverb_artefacts/Release/VST3
            build/HybridGateReverb_artefacts/Release/AU
            build/HybridGateReverb_artefacts/Release/LV2
            build/HybridGateReverb_artefacts/Release/Standalone

      - name: Read version
        shell: bash
        run: echo "VERSION=$(sed -n 's/^project(.* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" "/DSourceDir=$PWD\build\HybridGateReverb_artefacts\Release" installer\windows.iss

      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: installer/macos.sh "$VERSION" build/HybridGateReverb_artefacts/Release build/installer

      - name: Upload installer
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Installer-${{ matrix.name }}
          if-no-files-found: error
          path: build/installer/*

      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            --validate "build/HybridGateReverb_artefacts/Release/VST3/HybridGate Reverb.vst3"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Installer-*
          merge-multiple: true
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*
            docs/MANUAL.md
          generate_release_notes: true
